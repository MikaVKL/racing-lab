name: Tests

on:
  pull_request:
  push:
    branches: ['claude/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Dev-Server starten
        run: |
          nohup npx vite --port 5173 > vite.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5173/ > /dev/null && exit 0; sleep 1; done
          cat vite.log; exit 1
      - run: npm test
